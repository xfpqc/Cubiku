<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="115" fill="#121212"/>
  <defs>
    <g id="iso-grid-base">
      <rect x="0" y="0" width="180" height="180" fill="none" stroke-width="12" rx="16" stroke-linejoin="round"/>
      <line x1="60" y1="0" x2="60" y2="180" stroke-width="10" stroke-linecap="round"/>
      <line x1="120" y1="0" x2="120" y2="180" stroke-width="10" stroke-linecap="round"/>
      <line x1="0" y1="60" x2="180" y2="60" stroke-width="10" stroke-linecap="round"/>
      <line x1="0" y1="120" x2="180" y2="120" stroke-width="10" stroke-linecap="round"/>
    </g>
    <!-- Top layer with solid background fill safely behind the lines -->
    <g id="iso-grid-top">
      <rect x="0" y="0" width="180" height="180" fill="#1A282A" stroke="#A8DADC" stroke-width="12" rx="16" stroke-linejoin="round"/>
      <line x1="60" y1="0" x2="60" y2="180" stroke="#A8DADC" stroke-width="10" stroke-linecap="round"/>
      <line x1="120" y1="0" x2="120" y2="180" stroke="#A8DADC" stroke-width="10" stroke-linecap="round"/>
      <line x1="0" y1="60" x2="180" y2="60" stroke="#A8DADC" stroke-width="10" stroke-linecap="round"/>
      <line x1="0" y1="120" x2="180" y2="120" stroke="#A8DADC" stroke-width="10" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- z=2 (Bottom Layer) -->
  <use href="#iso-grid-base" stroke="#2A2A2A" transform="translate(256, 326) scale(1.3, 0.65) rotate(45) translate(-90, -90)" />
  
  <!-- z=1 (Middle Layer) -->
  <use href="#iso-grid-base" stroke="#4A4A4A" transform="translate(256, 256) scale(1.3, 0.65) rotate(45) translate(-90, -90)" />

  <!-- z=0 (Top Active Layer - Cyan with solid dark-cyan fill) -->
  <use href="#iso-grid-top" transform="translate(256, 186) scale(1.3, 0.65) rotate(45) translate(-90, -90)" />
</svg>
